name: Mantener Supabase Despierto

on:
  schedule:
    # Se ejecuta a las 09:00 UTC los lunes y jueves
    - cron: '0 9 * * 1,4'
  workflow_dispatch: # Permite activar el ping manualmente desde GitHub

jobs:
  ping_supabase:
    runs-on: ubuntu-latest

    steps:
    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Instalar cliente de Supabase
      run: pip install supabase

    - name: Ejecutar consulta Keep-Alive
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      run: |
        python -c "
        import os
        from supabase import create_client

        url = os.environ.get('SUPABASE_URL')
        key = os.environ.get('SUPABASE_KEY')
        if not url or not key:
            print('Error: Faltan las variables de entorno en los Secrets.')
            exit(1)

        supabase = create_client(url, key)

        try:
            # Consulta ligera a la tabla perfiles
            data = supabase.table('perfiles').select('username').limit(1).execute()
            print('¡Ping exitoso! Supabase sigue despierto y activo.')
        except Exception as e:
            print(f'Error en el ping: {e}')
            exit(1)
        "
