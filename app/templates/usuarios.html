<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mantenimiento de Usuarios - Gestión</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0f172a; --bg-card: #1e293b; --text-main: #f8fafc;
            --text-muted: #94a3b8; --primary: #38bdf8; --primary-hover: #0ea5e9;
            --danger: #ef4444; --border: #334155; --success: #22c55e;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; }
        .sidebar { width: 260px; background-color: var(--bg-card); border-right: 1px solid var(--border); padding: 2rem 1.5rem; display: flex; flex-direction: column; gap: 2rem; }
        
        /* Contenedor con fondo blanco al 50% de transparencia y esquinas redondeadas */
        .brand { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            width: 100%;
            background-color: rgba(255, 255, 255, 0.8); /* Blanco con 80% de opacidad */
            padding: 10px 14px;
            border-radius: 8px; /* Esquinas redondeadas suaves */
            margin-bottom: 0.5rem;
        }
        .sidebar-logo {
            width: 100%;
            max-width: 210px;
            height: auto;
            object-fit: contain;
        }

        .menu { display: flex; flex-direction: column; gap: 0.5rem; list-style: none; }
        .menu-item a { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem; color: var(--text-muted); text-decoration: none; border-radius: 0.5rem; font-weight: 500; }
        .menu-item.active a, .menu-item a:hover { background-color: rgba(56, 189, 248, 0.1); color: var(--primary); }
        .main-content { flex: 1; padding: 2rem 3rem; overflow-y: auto; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2.5rem; }
        .user-profile { display: flex; align-items: center; gap: 0.75rem; background: var(--bg-card); padding: 0.5rem 1rem; border-radius: 2rem; border: 1px solid var(--border); }
        
        .grid-layout { display: grid; grid-template-columns: 1fr 2fr; gap: 2rem; align-items: start; }
        .card { background-color: var(--bg-card); border: 1px solid var(--border); border-radius: 1rem; padding: 2rem; }
        h3 { color: var(--primary); margin-bottom: 1.5rem; font-size: 1.15rem; }
        .form-group { margin-bottom: 1.25rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; color: var(--text-muted); font-size: 0.875rem; }
        .form-control { width: 100%; background-color: var(--bg-dark); border: 1px solid var(--border); color: var(--text-main); padding: 0.75rem 1rem; border-radius: 0.5rem; outline: none; }
        
        .btn { padding: 0.75rem 1.5rem; border-radius: 0.5rem; font-weight: 600; border: none; cursor: pointer; display: inline-flex; align-items: center; gap: 0.5rem; justify-content: center; width: 100%; }
        .btn-primary { background-color: var(--primary); color: var(--bg-dark); }
        .btn-danger { background-color: rgba(239, 68, 68, 0.1); color: var(--danger); width: auto; padding: 0.5rem 0.75rem; border: none; border-radius: 0.375rem; cursor: pointer; }
        .btn-danger:hover { background-color: var(--danger); color: var(--text-main); }
        
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background-color: rgba(15, 23, 42, 0.5); padding: 1rem; font-size: 0.875rem; color: var(--text-muted); border-bottom: 1px solid var(--border); text-transform: uppercase; }
        td { padding: 1rem; border-bottom: 1px solid var(--border); }
        .error-banner { background-color: rgba(239, 68, 68, 0.1); color: var(--danger); padding: 1rem; border-radius: 0.5rem; margin-bottom: 1.5rem; border: 1px solid var(--danger); font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="brand">
            <img src="/static/logo_sidebar.png" alt="Logo Pasarin & Asociados" class="sidebar-logo">
        </div>
        <ul class="menu">
            <li class="menu-item"><a href="/panel"><i class="fa-solid fa-magnifying-glass"></i> Consultar</a></li>
            <li class="menu-item"><a href="/subir_pantalla"><i class="fa-solid fa-cloud-arrow-up"></i> Cargar Documentos</a></li>
            {% if rol == 'admin' %}
                <li class="menu-item active"><a href="/usuarios_pantalla"><i class="fa-solid fa-users-gear"></i> Usuarios</a></li>
                <li class="menu-item"><a href="/mantenimiento_pantalla"><i class="fa-solid fa-database"></i> Mantenimiento</a></li>
            {% endif %}
            <li class="menu-item logout" style="margin-top: auto;"><a href="/logout"><i class="fa-solid fa-right-from-bracket"></i> Salir</a></li>
        </ul>
    </div>

    <div class="main-content">
        <header>
            <h1>Mantenimiento de Usuarios</h1>
            <div class="user-profile"><i class="fa-solid fa-user-circle" style="color: var(--primary);"></i><span>{{ nombre }}</span></div>
        </header>

        {% if error %}<div class="error-banner"><i class="fa-solid fa-circle-exclamation"></i> {{ error }}</div>{% endif %}

        <div class="grid-layout">
            <div class="card">
                <h3 id="form-title">Registrar Usuario</h3>
                <form id="userForm" action="/crear_usuario" method="POST">
                    <div class="form-group">
                        <label>Nombre de Usuario</label>
                        <input type="text" name="username" id="username" class="form-control" required placeholder="ej. alfredo_lino">
                    </div>
                    <div class="form-group">
                        <label>Contraseña</label>
                        <input type="password" name="password" id="password" class="form-control" required placeholder="••••••••">
                    </div>
                    <div class="form-group">
                        <label>Rol del Sistema</label>
                        <select name="rol" id="rol-select" class="form-control">
                            <option value="usuario">Consulta (Usuario)</option>
                            <option value="admin">Administrador (Admin)</option>
                        </select>
                    </div>
                    <button type="submit" id="btn-submit" class="btn btn-primary"><i class="fa-solid fa-user-plus"></i> Guardar Usuario</button>
                    <button type="button" id="btn-cancelar" class="btn" style="background: transparent; color: var(--text-muted); display: none; margin-top: 0.5rem;" onclick="resetearFormulario()">Cancelar Edición</button>
                </form>
            </div>

            <div class="card" style="padding: 0; overflow: hidden;">
                <table>
                    <thead>
                        <tr>
                            <th>Usuario</th>
                            <th>Rol asignado</th>
                            <th style="width: 150px; text-align: center;">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-usuarios">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        async function cargarUsuarios() {
            const tbody = document.getElementById('tabla-usuarios');
            tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; color:var(--text-muted); padding:2rem;"><i class="fa-solid fa-spinner fa-spin"></i> Cargando cuentas...</td></tr>';
            try {
                const res = await fetch('/usuarios_lista');
                const usuarios = await res.json();
                tbody.innerHTML = "";
                
                usuarios.forEach(u => {
                    const fila = document.createElement('tr');
                    fila.innerHTML = `
                        <td><strong>${u.username}</strong></td>
                        <td><span style="color: ${u.rol === 'admin' ? 'var(--primary)' : 'var(--text-muted)'}">${u.rol.toUpperCase()}</span></td>
                        <td style="text-align: center; display: flex; gap: 0.5rem; justify-content: center; align-items: center;">
                            <button type="button" style="background: rgba(56,189,248,0.1); color: var(--primary); border:none; padding:0.5rem; border-radius:0.375rem; cursor:pointer; height:33px; width:35px;" onclick="prepararEdicion('${u.id}', '${u.username}', '${u.rol}')"><i class="fa-solid fa-pen-to-square"></i></button>
                            <button type="button" class="btn-danger" onclick="eliminarUsuario('${u.id}')"><i class="fa-solid fa-trash-can"></i></button>
                        </td>
                    `;
                    tbody.appendChild(fila);
                });
            } catch (e) { console.error(e); }
        }

        function prepararEdicion(id, username, rol) {
            document.getElementById('form-title').innerText = "Modificar Usuario";
            const form = document.getElementById('userForm');
            form.action = `/actualizar_usuario/${id}`;
            document.getElementById('username').value = username;
            document.getElementById('username').disabled = true;
            document.getElementById('rol-select').value = rol;
            document.getElementById('btn-submit').innerHTML = '<i class="fa-solid fa-user-pen"></i> Actualizar Datos';
            document.getElementById('btn-cancelar').style.display = 'block';
        }

        function resetearFormulario() {
            document.getElementById('form-title').innerText = "Registrar Usuario";
            const form = document.getElementById('userForm');
            form.action = "/crear_usuario";
            form.reset();
            document.getElementById('username').disabled = false;
            document.getElementById('btn-submit').innerHTML = '<i class="fa-solid fa-user-plus"></i> Guardar Usuario';
            document.getElementById('btn-cancelar').style.display = 'none';
        }

        async function eliminarUsuario(id) {
            if (confirm("¿Seguro que deseas eliminar esta cuenta de usuario?")) {
                const res = await fetch(`/borrar_usuario/${id}`, { method: 'DELETE' });
                if (res.ok) cargarUsuarios();
            }
        }

        cargarUsuarios();
    </script>
</body>
</html>
