<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultar Documentos - Gestión de Carátulas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0f172a; --bg-card: #1e293b; --text-main: #f8fafc;
            --text-muted: #94a3b8; --primary: #38bdf8; --primary-hover: #0ea5e9;
            --danger: #ef4444; --whatsapp: #25d366; --border: #334155;
            --section-title: #f1f5f9;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; }
        
        /* Sidebar Unificado */
        .sidebar { width: 260px; background-color: var(--bg-card); border-right: 1px solid var(--border); padding: 2rem 1.5rem; display: flex; flex-direction: column; gap: 2rem; }
        
        .brand { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            width: 100%;
            background-color: rgba(255, 255, 255, 0.8);
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 0.5rem;
        }
        .sidebar-logo {
            width: 100%;
            max-width: 210px;
            height: auto;
            object-fit: contain;
        }

        .menu { display: flex; flex-direction: column; gap: 0.5rem; list-style: none; }
        .menu-item a { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem; color: var(--text-muted); text-decoration: none; border-radius: 0.5rem; transition: 0.2s; font-weight: 500; }
        .menu-item.active a, .menu-item a:hover { background-color: rgba(56, 189, 248, 0.1); color: var(--primary); }
        
        /* Contenido Principal */
        .main-content { flex: 1; padding: 2rem 3rem; overflow-y: auto; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2.5rem; }
        
        .search-section { background-color: var(--bg-card); border: 1px solid var(--border); border-radius: 1rem; padding: 2rem; margin-bottom: 2rem; }
        .grid-filters { display: grid; grid-template-columns: 1.5fr 1fr 1fr 1fr auto; gap: 1rem; align-items: end; }
        
        .form-group { display: flex; flex-direction: column; gap: 0.5rem; }
        .form-group label { font-size: 0.875rem; color: var(--text-muted); }
        .form-control { background-color: var(--bg-dark); border: 1px solid var(--border); color: var(--text-main); padding: 0.75rem 1rem; border-radius: 0.5rem; outline: none; width: 100%; }
        
        .btn { padding: 0.75rem 1.5rem; border-radius: 0.5rem; font-weight: 600; border: none; cursor: pointer; display: inline-flex; align-items: center; gap: 0.5rem; height: 46px; transition: 0.2s; }
        .btn-primary { background-color: var(--primary); color: var(--bg-dark); }
        .btn-primary:hover { background-color: var(--primary-hover); }
        
        /* Contenedor de Resultados */
        .results-container { display: flex; flex-direction: column; gap: 1rem; }
        .tarjeta-resultado { border-left: 4px solid var(--primary); padding: 1rem 1.5rem; background-color: var(--bg-card); border-top: 1px solid var(--border); border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); border-radius: 0.5rem; display: flex; justify-content: space-between; align-items: center; transition: 0.2s; }
        .tarjeta-resultado:hover { background-color: rgba(255, 255, 255, 0.02); }
        
        .actions-cell { display: flex; gap: 0.75rem; }
        .btn-action { padding: 0.5rem 1rem; border-radius: 0.375rem; font-size: 0.875rem; font-weight: 500; display: inline-flex; align-items: center; gap: 0.375rem; cursor: pointer; border: none; transition: 0.2s; }
        .btn-view { background-color: rgba(56, 189, 248, 0.1); color: var(--primary); }
        .btn-whatsapp { background-color: rgba(37, 211, 102, 0.1); color: var(--whatsapp); }
        .no-data { padding: 3rem; text-align: center; color: var(--text-muted); width: 100%; background-color: var(--bg-card); border: 1px solid var(--border); border-radius: 1rem; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="brand">
            <img src="/static/logo_sidebar.png" alt="Logo Pasarin & Asociados" class="sidebar-logo">
        </div>
        <ul class="menu">
            <li class="menu-item active"><a href="/panel"><i class="fa-solid fa-magnifying-glass"></i> Consultar</a></li>
            <li class="menu-item"><a href="/subir_pantalla"><i class="fa-solid fa-cloud-arrow-up"></i> Cargar Documentos</a></li>
            <li class="menu-item logout" style="margin-top: auto;"><a href="/"><i class="fa-solid fa-right-from-bracket"></i> Salir</a></li>
        </ul>
    </div>

    <div class="main-content">
        <header>
            <h1>Consultar Cliente</h1>
        </header>

        <section class="search-section">
            <div class="grid-filters">
                <div class="form-group">
                    <label>Nombre o Apellido</label>
                    <input type="text" id="nombre" class="form-control" placeholder="Nombre o Apellido...">
                </div>
                <div class="form-group">
                    <label>Día</label>
                    <input type="number" id="dia" class="form-control" placeholder="Día">
                </div>
                <div class="form-group">
                    <label>Mes</label>
                    <input type="text" id="mes" class="form-control" placeholder="Mes (3 letras)">
                </div>
                <div class="form-group">
                    <label>Año</label>
                    <input type="number" id="anio" class="form-control" placeholder="Año">
                </div>
                <button class="btn btn-primary" onclick="ejecutarBusqueda()">
                    <i class="fa-solid fa-magnifying-glass"></i> Buscar Ahora
                </button>
            </div>
        </section>

        <div id="resultado" class="results-container">
            <div class="no-data">Inicia una búsqueda...</div>
        </div>
    </div>

    <script>
        async function ejecutarBusqueda() {
            const cliente = document.getElementById('nombre').value.trim();
            const dia = document.getElementById('dia').value.trim();
            const mes = document.getElementById('mes').value.trim();
            const anio = document.getElementById('anio').value.trim();
            const resDiv = document.getElementById('resultado');

            const params = new URLSearchParams();
            if (cliente) params.append('cliente', cliente);
            if (dia) params.append('dia', dia);
            if (mes) params.append('mes', mes);
            if (anio) params.append('anio', anio);

            try {
                const respuesta = await fetch(`/buscar_poliza?${params.toString()}`);
                const datos = await respuesta.json();

                resDiv.innerHTML = ""; 

                if (Array.isArray(datos) && datos.length > 0) {
                    datos.forEach(p => {
                        const tarjeta = document.createElement('div');
                        tarjeta.className = "tarjeta-resultado";
                        tarjeta.innerHTML = `
                            <div>
                                <h3 style="font-size: 1.15rem; font-weight: 700; margin-bottom: 0.25rem;">${p.cliente_nombre}</h3>
                                <p style="color: var(--text-muted); font-size: 0.9rem;"><i class="fa-solid fa-calendar-days"></i> Fecha: ${p.dia} / ${p.mes} / ${p.anio}</p>
                            </div>
                            <div class="actions-cell">
                                <button onclick="abrirVisor('${p.url_archivo}')" class="btn-action btn-view">
                                    <i class="fa-solid fa-file-pdf"></i> Ver PDF
                                </button>
                                <button onclick="enviarArchivoWhatsApp('${p.url_archivo}', '${p.cliente_nombre}')" class="btn-action btn-whatsapp">
                                    <i class="fa-brands fa-whatsapp"></i> WhatsApp
                                </button>
                            </div>
                        `;
                        resDiv.appendChild(tarjeta);
                    });
                } else {
                    const mensaje = datos.error ? datos.error : "No se encontraron coincidencias.";
                    resDiv.innerHTML = `<div class="no-data" style="color: var(--danger);">⚠️ ${mensaje}</div>`;
                }
            } catch (err) {
                console.error(err);
                resDiv.innerHTML = `<div class="no-data" style="color: var(--danger);">Ocurrió un error al conectar con el servidor.</div>`;
            }
        }

        async function enviarArchivoWhatsApp(url, nombre) {
            try {
                const respuesta = await fetch(url);
                const blob = await respuesta.blob();
                const archivo = new File([blob], `Poliza_${nombre.replace(/\s+/g, '_')}.pdf`, { type: 'application/pdf' });

                if (navigator.canShare && navigator.canShare({ files: [archivo] })) {
                    await navigator.share({
                        files: [archivo],
                        title: 'Póliza',
                        text: `Hola, te envío la póliza de ${nombre}`
                    });
                } else {
                    const mensaje = encodeURIComponent(`Hola ${nombre}, aquí tienes tu póliza: `);
                    window.open(`https://api.whatsapp.com/send?text=${mensaje}${url}`, '_blank');
                }
            } catch (err) {
                alert("Error al preparar el envío.");
            }
        }

        function abrirVisor(url) {
            const ancho = 900, alto = 800;
            const x = (screen.width / 2) - (ancho / 2);
            const y = (screen.height / 2) - (alto / 2);
            window.open(url, 'Visualizador', `width=${ancho},height=${alto},left=${x},top=${y},toolbar=no,location=no,status=no,menubar=no,scrollbars=yes,resizable=yes`);
        }
    </script>
</body>
</html>
