<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cargar Documentos - Gestión de Carátulas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0f172a; --bg-card: #1e293b; --text-main: #f8fafc;
            --text-muted: #94a3b8; --primary: #38bdf8; --primary-hover: #0ea5e9;
            --border: #334155; --success: #22c55e; --danger: #ef4444;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; }
        .sidebar { width: 260px; background-color: var(--bg-card); border-right: 1px solid var(--border); padding: 2rem 1.5rem; display: flex; flex-direction: column; gap: 2rem; }
        
        .brand { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            width: 100%;
            background-color: rgba(255, 255, 255, 0.8); 
            padding: 10px 14px;
            border-radius: 8px; 
            margin-bottom: 0.5rem;
        }
        .sidebar-logo {
            width: 100%;
            max-width: 210px;
            height: auto;
            object-fit: contain;
        }

        .menu { display: flex; flex-direction: column; gap: 0.5rem; list-style: none; }
        .menu-item a { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem; color: var(--text-muted); text-decoration: none; border-radius: 0.5rem; font-weight: 500; }
        .menu-item.active a, .menu-item a:hover { background-color: rgba(56, 189, 248, 0.1); color: var(--primary); }
        .main-content { flex: 1; padding: 2rem 3rem; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2.5rem; }
        .user-profile { display: flex; align-items: center; gap: 0.75rem; background: var(--bg-card); padding: 0.5rem 1rem; border-radius: 2rem; border: 1px solid var(--border); }
        
        .upload-container { max-width: 600px; margin: 0 auto; background-color: var(--bg-card); border: 1px solid var(--border); border-radius: 1rem; padding: 2.5rem; }
        .form-group { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1.5rem; }
        .form-group label { font-size: 0.9rem; color: var(--text-muted); font-weight: 500; }
        .form-control { width: 100%; background-color: var(--bg-dark); border: 1px solid var(--border); color: var(--text-main); padding: 0.85rem; border-radius: 0.5rem; outline: none; }
        
        .drop-zone { border: 2px dashed var(--border); border-radius: 0.5rem; padding: 2rem; text-align: center; cursor: pointer; transition: 0.2s; background-color: rgba(15, 23, 42, 0.3); }
        .drop-zone:hover, .drop-zone.dragover { border-color: var(--primary); background-color: rgba(56, 189, 248, 0.05); }
        .drop-zone i { font-size: 2.5rem; color: var(--text-muted); margin-bottom: 1rem; }
        .file-info { margin-top: 0.75rem; font-size: 0.9rem; color: var(--primary); font-weight: 600; text-align: left; max-height: 150px; overflow-y: auto; padding: 5px; }
        .file-item { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 4px; font-size: 0.85rem; color: var(--text-main); }
        .file-item.invalid { color: var(--danger); font-weight: bold; }
        
        .btn-submit { width: 100%; padding: 0.85rem; border-radius: 0.5rem; font-weight: 700; border: none; cursor: pointer; background-color: var(--primary); color: var(--bg-dark); font-size: 1rem; margin-top: 1rem; display: flex; align-items: center; justify-content: center; gap: 0.5rem; }
        .btn-submit:hover { background-color: var(--primary-hover); }
        .btn-submit:disabled { background-color: var(--border); color: var(--text-muted); cursor: not-allowed; }
        
        .toast { position: fixed; bottom: 20px; right: 20px; padding: 1rem 1.5rem; border-radius: 0.5rem; color: white; display: flex; align-items: center; gap: 0.75rem; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); transform: translateY(150%); transition: transform 0.3s ease; z-index: 1000; font-weight: 600; }
        .toast.success { background-color: var(--success); }
        .toast.danger { background-color: var(--danger); }
        .toast.show { transform: translateY(0); }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="brand">
            <img src="/static/logo_sidebar.png" alt="Logo Pasarin & Asociados" class="sidebar-logo">
        </div>
        <ul class="menu">
            <li class="menu-item"><a href="/panel"><i class="fa-solid fa-magnifying-glass"></i> Consultar</a></li>
            <li class="menu-item active"><a href="/subir_pantalla"><i class="fa-solid fa-cloud-arrow-up"></i> Cargar Documentos</a></li>
            {% if rol == 'admin' %}
            <li class="menu-item"><a href="/usuarios_pantalla"><i class="fa-solid fa-users-gear"></i> Usuarios</a></li>
            <li class="menu-item"><a href="/mantenimiento_pantalla"><i class="fa-solid fa-database"></i> Mantenimiento</a></li>
            {% endif %}
            <li class="menu-item logout" style="margin-top: auto;"><a href="/logout"><i class="fa-solid fa-right-from-bracket"></i> Salir</a></li>
        </ul>
    </div>

    <div class="main-content">
        <header>
            <h1>Cargar Nuevos Documentos</h1>
            <div class="user-profile"><i class="fa-solid fa-user-circle" style="color: var(--primary);"></i><span>{{ nombre }}</span></div>
        </header>

        <div class="upload-container">
            <form id="upload-form" onsubmit="enviarPoliza(event)">
                
                <div class="form-group">
                    <label>Tipo de Documento</label>
                    <div style="display: flex; background: var(--bg-dark); padding: 4px; border-radius: 0.5rem; max-width: 250px; border: 1px solid var(--border);">
                        <button type="button" id="btn-poliza" onclick="seleccionarTipo('poliza')" style="flex: 1; padding: 8px 12px; border: none; border-radius: 0.35rem; cursor: pointer; background-color: var(--primary); color: var(--bg-dark); font-weight: bold; transition: all 0.2s;">
                            Póliza
                        </button>
                        <button type="button" id="id-btn-recibo" onclick="seleccionarTipo('recibo')" style="flex: 1; padding: 8px 12px; border: none; border-radius: 0.35rem; cursor: pointer; background-color: transparent; color: var(--text-muted); transition: all 0.2s;">
                            Recibo
                        </button>
                    </div>
                    <input type="hidden" id="tipo_documento" name="tipo" value="poliza">
                </div>

                <div class="form-group">
                    <label for="anio">Año del Documento</label>
                    <select id="anio" name="anio" class="form-control">
                    </select>
                </div>

                <div class="form-group">
                    <label>Archivo PDF Físico</label>
                    <div id="drop-zone" class="drop-zone" onclick="document.getElementById('file-input').click()">
                        <i class="fa-solid fa-file-pdf"></i>
                        <p id="drop-text">Arrastra los archivos aquí o haz clic para buscar</p>
                        <input type="file" id="file-input" name="file" accept="application/pdf" multiple style="display: none;" onchange="mostrarNombreArchivo()">
                        <div id="file-info" class="file-info"></div>
                    </div>
                </div>

                <button type="submit" id="btn-enviar" class="btn-submit"><i class="fa-solid fa-cloud-arrow-up"></i> Subir al Servidor</button>
            </form>
        </div>
    </div>

    <div id="toast" class="toast"><i id="toast-icon" class="fa-solid"></i> <span id="toast-msg"></span></div>

    <script>
        let archivosSeleccionados = [];

        function seleccionarTipo(tipo) {
            const btnPoliza = document.getElementById('btn-poliza');
            const btnRecibo = document.getElementById('id-btn-recibo');
            const inputTipo = document.getElementById('tipo_documento');
            
            inputTipo.value = tipo;
            
            if (tipo === 'poliza') {
                btnPoliza.style.backgroundColor = "var(--primary)";
                btnPoliza.style.color = "var(--bg-dark)";
                btnPoliza.style.fontWeight = "bold";
                
                btnRecibo.style.backgroundColor = "transparent";
                btnRecibo.style.color = "var(--text-muted)";
                btnRecibo.style.fontWeight = "normal";
            } else {
                btnPoliza.style.backgroundColor = "transparent";
                btnPoliza.style.color = "var(--text-muted)";
                btnPoliza.style.fontWeight = "normal";
                
                btnRecibo.style.backgroundColor = "var(--primary)";
                btnRecibo.style.color = "var(--bg-dark)";
                btnRecibo.style.fontWeight = "bold";
            }
        }

        function inicializarAnios() {
            const selectAnio = document.getElementById('anio');
            const anioActual = new Date().getFullYear();
            
            for (let i = 0; i < 3; i++) {
                const anioVigente = anioActual - i;
                const opt = document.createElement('option');
                opt.value = anioVigente;
                opt.innerText = `Año ${anioVigente}`;
                selectAnio.appendChild(opt);
            }
        }

function validarNombreArchivo(nombre) {
    // 1. Quitamos la extensión (.pdf) y los espacios de las orillas para analizar el texto limpio
    const nombreLimpio = nombre.replace(/\.[^/.]+$/, "").trim();
    
    // CANDADO 1: Si contiene un guion medio (-), se bloquea de inmediato.
    if (nombreLimpio.includes('-')) {
        return { 
            valido: false, 
            motivo: "No se permiten guiones medios (-). Si es un archivo extra, usa guion bajo y número al final (Ej: _1)." 
        };
    }
    
    // CANDADO 2: Detectar palabras prohibidas al final con guion bajo (_copia, _autos)
    const tieneTextoInvalidoAlFinal = /_(COPIA|AUTOS|RECIBO|CORREGIDO|CHECK|OK|RESPALDO)$/i.test(nombreLimpio);
    if (tieneTextoInvalidoAlFinal) {
        return {
            valido: false,
            motivo: "No uses palabras como '_copia' o '_autos' al final. Si es un archivo extra, usa guion bajo y número (Ej: _1)."
        };
    }
    
    // CANDADO 3: DETECTAR MINÚSCULAS PEBADAS AL APELLIDO (Ej: ALVAREZcopia)
    // Buscamos si hay letras minúsculas en el nombre. Como tus nombres son 100% en mayúsculas,
    // si el usuario escribe algo en minúsculas (excepto la extensión que ya quitamos), es un texto extra.
    const tieneMinusculas = /[a-záéíóúñ]/.test(nombreLimpio);
    if (tieneMinusculas) {
        return {
            valido: false,
            motivo: "Detectamos letras minúsculas en el nombre. Todo el nombre del cliente debe ir en MAYÚSCULAS. Si es un archivo extra, usa _1, _2 al final."
        };
    }
    
    // Si pasa todos los filtros, está limpio
    return { valido: true };
}
        
        function mostrarNombreArchivo() {
            const input = document.getElementById('file-input');
            const info = document.getElementById('file-info');
            const text = document.getElementById('drop-text');
            const btnEnviar = document.getElementById('btn-enviar');
            
            if(input.files.length > 0) {
                archivosSeleccionados = Array.from(input.files);
            }

            let hayErrores = false;

            if(archivosSeleccionados.length > 0) {
                text.style.display = "none";
                info.innerHTML = ""; 
                
                archivosSeleccionados.forEach(file => {
                    const validacion = validarNombreArchivo(file.name);
                    const item = document.createElement('div');
                    
                    if (!validacion.valido) {
                        hayErrores = true;
                        item.className = 'file-item invalid';
                        item.innerHTML = `<i class="fa-solid fa-triangle-exclamation" style="color: var(--danger);"></i> <span title="${validacion.motivo}">${file.name} (Error de formato)</span>`;
                    } else {
                        item.className = 'file-item';
                        item.innerHTML = `<i class="fa-solid fa-file-pdf" style="color: red;"></i> <span>${file.name}</span>`;
                    }
                    info.appendChild(item);
                });

                // Si hay algún error detectado, congelamos el botón de subida
                if (hayErrores) {
                    btnEnviar.disabled = true;
                    btnEnviar.style.backgroundColor = "var(--border)";
                    btnEnviar.style.color = "var(--text-muted)";
                    lanzarToast("Hay archivos con formato de nombre inválido. Corrígelos antes de subir.", "danger");
                } else {
                    btnEnviar.disabled = false;
                    btnEnviar.style.backgroundColor = "var(--primary)";
                    btnEnviar.style.color = "var(--bg-dark)";
                }
            }
        }

        function lanzarToast(mensaje, tipo) {
            const toast = document.getElementById('toast');
            const msg = document.getElementById('toast-msg');
            const icon = document.getElementById('toast-icon');
            
            msg.innerText = mensaje;
            toast.className = `toast ${tipo} show`;
            icon.className = tipo === 'success' ? 'fa-solid fa-circle-check' : 'fa-solid fa-circle-exclamation';
            
            setTimeout(() => { toast.classList.remove('show'); }, 4000);
        }

        async function enviarPoliza(e) {
            e.preventDefault();
            const btnEnviar = document.getElementById('btn-enviar');
            
            if(archivosSeleccionados.length === 0) {
                lanzarToast("Por favor, selecciona al menos un archivo PDF.", "danger");
                return;
            }

            btnEnviar.disabled = true;
            btnEnviar.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Subiendo archivos...`;

            const anio = document.getElementById('anio').value;
            const tipo = document.getElementById('tipo_documento').value;
            
            let exitos = 0;
            let errores = 0;
            let mensajesErrores = [];

            for (const file of archivosSeleccionados) {
                const formData = new FormData();
                formData.append('file', file);
                formData.append('anio', anio);
                formData.append('tipo', tipo);

                try {
                    const res = await fetch('/subir_poliza', { method: 'POST', body: formData });
                    const data = await res.json();
                    
                    if (data.message === "Exito") {
                        exitos++;
                    } else if (data.error === "duplicado") {
                        errores++;
                        mensajesErrores.push(data.message);
                    } else {
                        errores++;
                        mensajesErrores.push(`${file.name}: ${data.error}`);
                    }
                } catch (err) {
                    errores++;
                    mensajesErrores.push(`${file.name}: Error de conexión.`);
                }
            }

            if (exitos > 0 && errores === 0) {
                lanzarToast(`¡Éxito! Se cargaron los ${exitos} documentos correctamente.`, "success");
            } else if (exitos > 0 && errores > 0) {
                lanzarToast(`Se subieron ${exitos} archivos, pero ${errores} fallaron o estaban duplicados.`, "danger");
                if(mensajesErrores.length > 0) {
                    setTimeout(() => alert("Detalle de las pólizas no subidas:\n\n" + mensajesErrores.join("\n")), 800);
                }
            } else {
                lanzarToast(`No se pudo subir ningún archivo. Revisa los duplicados o errores.`, "danger");
                if(mensajesErrores.length > 0) {
                    setTimeout(() => alert("Errores detectados:\n\n" + mensajesErrores.join("\n")), 800);
                }
            }

            btnEnviar.disabled = false;
            btnEnviar.innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i> Subir al Servidor`;
            document.getElementById('upload-form').reset();
            document.getElementById('drop-text').style.display = "block";
            document.getElementById('file-info').innerHTML = "";
            archivosSeleccionados = [];
            seleccionarTipo('poliza');
        }

        const dropZone = document.getElementById('drop-zone');
        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => { e.preventDefault(); dropZone.classList.add('dragover'); }, false);
        });
        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => { e.preventDefault(); dropZone.classList.remove('dragover'); }, false);
        });
        dropZone.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;
            const files = dt.files;
            
            if(files.length > 0) {
                archivosSeleccionados = Array.from(files).filter(f => f.type === "application/pdf" || f.name.toLowerCase().endsWith('.pdf'));
                if(archivosSeleccionados.length === 0) {
                    lanzarToast("Solo se permiten archivos en formato PDF.", "danger");
                }
                mostrarNombreArchivo();
            }
        });

        window.onload = inicializarAnios;
    </script>
</body>
</html>
